[package]
name = "battle-ex"
version = "0.1.0"
edition = "2021"
description = "Battle EX LAN game platform"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
[profile.release]
strip = true
lto = true
