spring.application.name=battle-ex
server.address=${BATTLE_BIND:127.0.0.1}
server.port=${BATTLE_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
battle.mongo-uri=${BATTLE_MONGO_URI:}
battle.mongo-db=${BATTLE_MONGO_DB:battle_ex}
battle.allowed-origins=${BATTLE_ALLOWED_ORIGINS:http://localhost:1420,http://127.0.0.1:1420,http://tauri.localhost,https://tauri.localhost,tauri://localhost}

battle.network.issuer-key-file=${BATTLE_NETWORK_ISSUER_KEY_FILE:}
battle.network.relay-node=${BATTLE_NETWORK_RELAY_NODE:battle-relay}
battle.network.relay-url=${BATTLE_NETWORK_RELAY_URL:}
battle.network.stun-url=${BATTLE_NETWORK_STUN_URL:}
battle.network.ice=${BATTLE_NETWORK_ICE:true}
battle.network.relay-secret-file=${BATTLE_NETWORK_RELAY_SECRET_FILE:}

spring.main.web-application-type=reactive

battle.network.relay-directory-file=${BATTLE_NETWORK_RELAY_DIRECTORY_FILE:}

battle.network.lease-seconds=${BATTLE_NETWORK_LEASE_SECONDS:840}
battle.network.metrics-retention-minutes=${BATTLE_NETWORK_METRICS_RETENTION_MINUTES:1440}

battle.state-mode=${BATTLE_STATE_MODE:memory}
