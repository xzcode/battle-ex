name: Windows development release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New development tag (v0.1.0-rc.N); draft only'
        required: true
        type: string
      confirm:
        description: 'Create a draft after native build and network tests pass'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: inputs.confirm && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/windows-build.yml
  network:
    if: inputs.confirm && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/windows-network-test.yml
  draft:
    needs: [build, network]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: battle-ex-windows-x64
          path: artifacts/windows-desktop
      - name: Create draft, not a public release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          (cd artifacts/windows-desktop && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --target "$COMMIT" --draft --prerelease \
            --title "Battle EX $TAG (development candidate)" \
            --notes "Unsigned Windows desktop artifacts. Native synthetic network acceptance passed in CI. Actual commercial-game compatibility, separate privileged service provisioning and owner license approval remain release gates. Do not publish as a stable release." \
            artifacts/windows-desktop/*
